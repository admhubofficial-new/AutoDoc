name: Uji keamanan AutoDoc

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-tests:
    name: Uji PIN dan sesi
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Siapkan Deno untuk Edge Function
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Periksa tipe Supabase Edge Function
        run: deno check supabase/functions/autodoc-auth/index.ts
      - name: Lint modul Supabase Edge Function
        run: deno lint supabase/functions/autodoc-auth
      - name: Periksa sintaks seluruh modul frontend
        run: |
          for file in ./*.js; do
            node --check "$file"
          done
      - name: Jalankan unit test
        run: npm test
      - name: Siapkan Chromium untuk uji browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Jalankan uji interaksi browser
        run: npm run test:browser
