name: Uji keamanan AutoDoc

on:
  push:
    branches:
      - main
      - feat/token-setup-session-auth
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-tests:
    name: Uji PIN dan sesi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Siapkan Deno untuk Edge Function
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Periksa tipe Supabase Edge Function
        run: deno check supabase/functions/autodoc-auth/index.ts
      - name: Periksa sintaks frontend Data Master
        run: node --check master.js
      - name: Jalankan unit test
        run: npm test
